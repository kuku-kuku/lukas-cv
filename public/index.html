<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Lukas Beneta – independent software engineering practice in Klaipėda, Lithuania. Web applications, backend systems, API integrations, automation and performance work."
    />
    <meta name="author" content="Lukas Beneta" />
    <link rel="canonical" href="https://www.beneta.lt/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Type system: Archivo (display / UI) + JetBrains Mono (technical labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!-- Open Graph / social preview -->
    <meta property="og:site_name" content="Beneta" />
    <meta property="og:title" content="Lukas Beneta — Software Engineering Practice" />
    <meta
      property="og:description"
      content="Web applications, backend systems, API integrations and automation. Engineered, measured, shipped."
    />
    <meta property="og:image" content="https://www.beneta.lt/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.beneta.lt" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="lt_LT" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lukas Beneta — Software Engineering Practice" />
    <meta
      name="twitter:description"
      content="Web applications, backend systems, API integrations and automation."
    />
    <meta name="twitter:image" content="https://www.beneta.lt/og.png" />

    <title>Beneta — Software Engineering Practice</title>

    <!-- Paint the page shell before React boots: no white flash, no layout shift -->
    <style>
      html { background: #0a0a0b; }
      body { margin: 0; background: #0a0a0b; color: #f1efea; }
      #root { min-height: 100vh; }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Beneta — Lukas Beneta",
        "url": "https://www.beneta.lt",
        "image": "https://www.beneta.lt/og.png",
        "description": "Independent software engineering practice: web applications, backend systems, API integrations, automation and performance work.",
        "areaServed": "LT",
        "availableLanguage": ["lt", "en"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Klaipėda",
          "addressCountry": "LT"
        },
        "founder": {
          "@type": "Person",
          "name": "Lukas Beneta",
          "jobTitle": "Software Engineer"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Counter.dev analytics -->
    <script
      src="https://cdn.counter.dev/script.js"
      data-id="05e3ca4a-ce8b-4051-b562-0053dab1612c"
      data-utcoffset="3"

    ></script>
  </body>
</html>
