    <!-- Type system: Archivo (display / UI) + JetBrains Mono (technical
         labels), self-hosted. The @font-face rules ship inside the main
         stylesheet so the browser discovers them on the first CSS parse;
         these preloads start the two display faces in parallel with it.
         Lithuanian needs latin-ext, so both subsets are preloaded. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-latin-ext.woff2"
      crossorigin
    />

    <!-- Open Graph / social preview -->
    <meta property="og:site_name" content="Beneta" />
    <meta property="og:title" content="Lukas Beneta - Software Engineering Practice" />
    <meta
      property="og:description"
      content="Web applications, backend systems, API integrations and automation. Engineered, measured, shipped."

    <title>Beneta - Software Engineering Practice</title>

    <!-- Paint the page shell before React boots: no white flash, no layout shift -->
    <style>
      /* Self-hosted type, declared inline so the browser discovers the font
         files on its first parse of the document - no stylesheet round trip
         in front of them. Generated by scripts/fetch-fonts.mjs. */
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/archivo-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/archivo-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 500;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      html { background: #0a0a0b; }
      body { margin: 0; background: #0a0a0b; color: #f1efea; }
      #root { min-height: 100vh; }
    </style>
